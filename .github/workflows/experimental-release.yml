name: Experimental Trainer Release

# A tag push builds, checks and publishes. A manual run (workflow_dispatch), on any
# ref including an experimental-v* tag, only builds and checks: the release job
# requires a push event.
on:
  push:
    tags:
      - 'experimental-v*'
  workflow_dispatch:

permissions:
  contents: read

# Runs for one ref queue instead of racing each other to the same release.
concurrency:
  group: experimental-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'CatMeow-233/surogate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/experimental-release/uv
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.12.23'
      # The same fork/dev commands as fork-ci's experimental job: CPU torch and
      # requirements-ci.txt in fork/.venv-experimental, tests run from fork/experimental.
      - name: Run experimental CPU tests
        run: fork/dev test experimental
      - name: Build the standalone wheel, sdist, and examples
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            fork/dev release experimental --tag "$RELEASE_TAG"
          else
            fork/dev release experimental
          fi
      - name: Check the installed package outside the checkout
        run: |
          uv --no-config pip install --python fork/.venv-experimental/bin/python --no-deps build/experimental-release/artifacts/*.whl
          uv --no-config pip check --python fork/.venv-experimental/bin/python
          interpreter="$GITHUB_WORKSPACE/fork/.venv-experimental/bin/python"
          archive="$GITHUB_WORKSPACE/build/experimental-release/artifacts/experimental-examples.zip"
          cd "$RUNNER_TEMP"
          "$interpreter" -m zipfile -e "$archive" experimental-examples
          "$interpreter" -I -m surogate.experimental.train --help
          "$interpreter" -I -m surogate.experimental.train experimental-examples/examples/experimental/smoke.yaml --validate-only
          "$interpreter" -I -m surogate.experimental.train experimental-examples/examples/experimental/smoke.yaml
      - name: Verify release checksums
        working-directory: build/experimental-release/artifacts
        run: sha256sum --check SHA256SUMS
      - name: Verify the built source identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          info = json.loads(Path('build/experimental-release/artifacts/build-info.json').read_text())
          assert info['source_commit'] == os.environ['GITHUB_SHA']
          assert info['source_dirty'] is False
          assert info['native_cuda_artifacts'] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surogate-experimental-release
          path: build/experimental-release/artifacts/*
          if-no-files-found: error

  release:
    needs: build
    if: >-
      github.repository == 'CatMeow-233/surogate' && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/experimental-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: surogate-experimental-release
          path: experimental-artifacts
      - name: Verify downloaded artifacts
        working-directory: experimental-artifacts
        run: sha256sum --check SHA256SUMS
      # A version is published once: a release for the tag, published or a draft a
      # failed run left behind, fails the job before anything is uploaded.
      - name: Refuse a tag that already has a release or a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 fork/tools/release_guard.py absent --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
      # softprops publishes a new prerelease before uploading unless draft is true;
      # the draft is visible only to collaborators until the next step publishes it.
      - name: Upload to a draft prerelease
        id: draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: CatMeow-233/surogate
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Surogate experimental trainer ${{ github.ref_name }}
          body_path: fork/experimental/RELEASE_NOTES.md
          draft: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: false
          files: experimental-artifacts/*
      - name: Verify the uploaded files and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: >-
          python3 fork/tools/release_guard.py publish --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
          --release-id "$RELEASE_ID" --artifacts experimental-artifacts
