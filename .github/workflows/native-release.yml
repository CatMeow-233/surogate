name: Native Wheel Release

# The fork's native wheel (trainer + serving engine) for the RTX 50 series, built on a free
# GitHub runner. fork/native/release/build-wheel.sh does the work inside the CUDA build image;
# this file only prepares the runner, caches ccache and publishes. Upstream's wheel.yml needs
# Blacksmith runners the fork does not have, and its tags are v*.
#
# To release, change fork/native/release/VERSION and push: the run builds the wheel and then
# creates the tag native-v<VERSION> at the pushed commit while publishing the prerelease. A
# VERSION whose tag already exists is skipped, so merging that change into another branch does
# not publish twice. A manual run only builds (it needs this file on the default branch).
on:
  push:
    branches: ['**']
    paths: ['fork/native/release/VERSION']
  workflow_dispatch:
    inputs:
      archs:
        description: CUDA architectures, ';'-separated (120a = RTX 50 series)
        default: '120a'

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'CatMeow-233/surogate'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: plan
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="native-v$(tr -d '[:space:]' < fork/native/release/VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  wheel:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ARCHS: ${{ inputs.archs || '120a' }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      IMAGE: nvidia/cuda:13.1.1-cudnn-devel-ubuntu24.04
      CCACHE_HOST_DIR: /mnt/ccache
    steps:
      # The runner has 4 CPUs, 16 GB and a small root disk. Removing preinstalled toolchains
      # makes room for the image, torch and the build tree; swap on /mnt lets the CUTLASS FP4
      # units (about 8 GB of cicc each) run several at a time.
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          swap=$(( avail / 2 )); [ "$swap" -gt 24 ] && swap=24
          if [ "$swap" -ge 4 ]; then
            sudo fallocate -l "${swap}G" /mnt/swapfile
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile >/dev/null
            sudo swapon /mnt/swapfile
          fi
          sudo mkdir -p "$CCACHE_HOST_DIR"
          sudo chown "$(id -u):$(id -g)" "$CCACHE_HOST_DIR"
          free -g
          df -h / /mnt

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # As in wheel.yml: restore and save are separate so a build that runs out of time still
      # seeds the cache, and re-running the job continues where it stopped.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ccache
          key: native-ccache-${{ env.ARCHS }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-ccache-${{ env.ARCHS }}-${{ github.sha }}-
            native-ccache-${{ env.ARCHS }}-

      - name: Build the wheel in the CUDA image
        timeout-minutes: 320
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -v "$CCACHE_HOST_DIR:/ccache" -w /w \
            -e RELEASE_TAG -e ARCHS -e HOST_UID="$(id -u)" \
            "$IMAGE" bash fork/native/release/build-wheel.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/ccache
          key: native-ccache-${{ env.ARCHS }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surogate-native-wheel
          path: wheelhouse/*
          if-no-files-found: error

  release:
    needs: [plan, wheel]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: surogate-native-wheel
          path: wheelhouse
      - name: Verify checksums and write the release notes
        working-directory: wheelhouse
        run: |
          sha256sum --check SHA256SUMS
          wheel=$(ls *.whl)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${wheel//+/%2B}"
          cat > ../notes.md <<EOF
          Native Surogate wheel built from \`${GITHUB_SHA}\`: upstream invergent-ai/surogate plus this fork's changes (see \`fork/patches/ledger.toml\`).

          - CUDA 13.1, Python 3.12, x86_64; GPU code for: \`$(python3 -c 'import json;print(json.load(open("build-info.json"))["archs"])')\` (120a = RTX 50 series).
          - Built by \`.github/workflows/native-release.yml\` on a GitHub-hosted runner; not tested on a GPU before publishing.

          Install into a Python 3.12 virtual environment:

          \`\`\`bash
          uv venv --python 3.12 && source .venv/bin/activate
          uv pip install "${url}"
          \`\`\`
          EOF
      - name: Publish the prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          repository: CatMeow-233/surogate
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Surogate native ${{ env.RELEASE_TAG }}
          body_path: notes.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: wheelhouse/*
