name: Fork CI

# Checks for CatMeow-233/surogate. Every job runs a fork/dev command, so CI and a local run
# execute the same thing; fork/docs/sync.md lists the jobs main requires.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

jobs:
  check:
    if: github.repository == 'CatMeow-233/surogate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch upstream main
        run: git fetch --no-tags https://github.com/invergent-ai/surogate.git main:refs/remotes/upstream/main
      - name: Ledger, maps, doc links and make targets
        run: fork/dev check
      - name: Release gates (plan.sh, release_plan.sh against synthetic repositories)
        run: fork/dev test release

  experimental:
    if: github.repository == 'CatMeow-233/surogate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.12.23'
      - name: Experimental tests (CPU torch, fork/.venv-experimental)
        run: fork/dev test experimental
      - name: Build the release artefacts without publishing
        run: fork/dev release experimental

  fork-tests:
    if: github.repository == 'CatMeow-233/surogate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CPU torch and the CPU-lane dependencies
        run: |
          python -m pip install 'torch==2.11.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r fork/tools/requirements-cpu-lane.txt
      # fork/dev stops each test after FORK_TEST_TIMEOUT (120 s): a test that blocks fails by name.
      # The step limits are a backstop well above the suites' run times (patches 8 s, tlc 70 s).
      - name: GRPO patch tests
        timeout-minutes: 10
        run: FORK_PY=python fork/dev test patches
      - name: TLC CPU tests
        timeout-minutes: 15
        run: FORK_PY=python fork/dev test tlc
      - name: Maintenance tool tests (sync, ledger checks, fork/dev, native hook contract, release guard)
        timeout-minutes: 10
        run: FORK_PY=python fork/dev test tools

  openmp-contract:
    if: github.repository == 'CatMeow-233/surogate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: OpenMP contract (cmake, g++, ctest)
        run: fork/dev test openmp

  # Not required for main until known_failures.txt is confirmed by two identical runs here.
  upstream-cpu-lane:
    if: github.repository == 'CatMeow-233/surogate'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CPU torch and the CPU-lane dependencies
        run: |
          python -m pip install 'torch==2.11.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r fork/tools/requirements-cpu-lane.txt
      - name: Upstream pytest suites against known_failures.txt
        run: FORK_PY=python fork/tools/test_cpu.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fork-test-cpu-junit
          path: build/fork-test-cpu/*.xml
          if-no-files-found: warn
