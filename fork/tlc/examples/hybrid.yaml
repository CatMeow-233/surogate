# TLC P0 run configuration for row A1h (Mamba-2 with attention at layers 6 and 12), for `python -m surogate_tlc train`.
# An upstream SFT config plus the `tlc` table (fork/tlc/README.md, 训练驱动); the G0-G3 runbook there prepares
# $TLC_RUNS (tokenizer, shards, model directories). Select a stage with --stage smoke|overfit|pilot; the run
# directory is <output_dir>/<stage>, or <stage>-mb<B> with --microbatch B.
model: ${TLC_RUNS}/models/A1h
output_dir: ${TLC_RUNS}/train/A1h
run_name: tlc-a1h

sequence_len: 512
# 32 x 512 tokens per microbatch (v0.7 §13); gradient_accumulation_steps follows from tlc.tokens_per_update.
per_device_train_batch_size: 32
gpus: 1
recipe: bf16
recompute: false
use_cuda_graphs: true

# Software-gate settings, not tuned: the learning rate is swept per architecture in Phase 1.
optimizer: adamw
learning_rate: 1.0e-3
lr_scheduler_type: cosine
final_lr_fraction: 0.1
warmup_steps: 30
weight_decay: 0.1
adamw_beta2: 0.95
max_grad_norm: 1.0
train_seed: 1
eval_seed: 1

logging_steps: 1
log_gpu_util: 10
save_total_limit: 3
resume_from_checkpoint: true

tlc:
  data: ${TLC_RUNS}/data
  tokens_per_update: 16384
  on_oom: fail
  max_downshifts: 2
  stages:
    # G3: 10-step smoke run; its checkpoint at step 5 serves the G2 resume check.
    smoke:
      max_steps: 10
      warmup_steps: 2
      eval_steps: 5
      save_steps: 5
    # G3: 100 steps on one fixed batch (the first 32 rows of train-00000.bin) at a constant learning rate.
    overfit:
      max_steps: 100
      fixed_batch: true
      lr_scheduler_type: constant
      warmup_steps: 10
      eval_steps: 50
      save_steps: 50
    # G3: 300-step pilot, 4,915,200 nominal tokens.
    pilot:
      max_steps: 300
      eval_steps: 50
      save_steps: 100
