# Adapter control run on the independent experimental backend.
schema_version: 1
model: Qwen/Qwen3-4B
train_jsonl: ./train.tokens.jsonl
output_dir: ../../outputs/experimental-5090-lora
device: cuda
dtype: bfloat16
max_sequence_length: 2048
batch_size: 1
gradient_accumulation_steps: 8
max_steps: 1000
learning_rate: 0.0001
warmup_steps: 25
optimizer: adamw
lora_rank: 16
lora_alpha: 32
lora_dropout: 0
lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
gradient_checkpointing: true
max_grad_norm: 1
save_every: 100
seed: 42
