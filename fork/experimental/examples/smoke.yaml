schema_version: 1
model_config:
  model_type: llama
  vocab_size: 64
  hidden_size: 16
  intermediate_size: 32
  num_hidden_layers: 2
  num_attention_heads: 2
  num_key_value_heads: 1
  max_position_embeddings: 64
  attention_dropout: 0.0
  tie_word_embeddings: false
train_jsonl: ./smoke.tokens.jsonl
output_dir: ../../outputs/experimental-smoke
device: cpu
dtype: float32
max_sequence_length: 32
batch_size: 1
gradient_accumulation_steps: 2
max_steps: 3
learning_rate: 0.001
optimizer: rank_scaled
projection_rank: 1
projection_interval: 2
gradient_checkpointing: false
save_every: 1
seed: 42
