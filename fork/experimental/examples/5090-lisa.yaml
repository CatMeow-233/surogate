# Approximate full fine-tuning: rotate two trainable decoder layers.
schema_version: 1
model: Qwen/Qwen3-4B
train_jsonl: ./train.tokens.jsonl
output_dir: ../../outputs/experimental-5090-lisa
device: cuda
dtype: bfloat16
attention_implementation: sdpa
max_sequence_length: 2048
batch_size: 1
gradient_accumulation_steps: 8
max_steps: 1000
learning_rate: 0.00002
warmup_steps: 25
weight_decay: 0.01
optimizer: rank_scaled
projection_rank: 1
projection_interval: 200
projection_scale: 1.0
lisa_layers: 2
lisa_interval: 20
lisa_state_policy: drop
layer_path: model.layers
gradient_checkpointing: true
optimizer_in_backward: false
max_grad_norm: 0
save_every: 100
seed: 42
