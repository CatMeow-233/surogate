# boundaries (unpacked SFT, one document per row, eval, the in-runtime decode prefill), logits x1.1456; packed
# micro-steps went to flash_varlen at the declared scale. Synthetic Gemma4-style configs with a full layer at
# Hs <= 128 had 1.0 replaced by 1/sqrt(Hs); published Gemma 3/4 sizes other than 27B never reach cuDNN.
# Resume: no format changes, but a pre-T22 checkpoint or adapter of such a model resumed after T22 runs its global
