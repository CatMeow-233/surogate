# Fork ledger: the single record of how this fork differs from upstream.
#
# fork/tools/check_divergence.py compares it with
# `git diff -M --name-status $(git merge-base HEAD upstream/main) HEAD`:
#   A (added)     must be under an [owned] prefix or listed in [owned].files
#   M (modified)  must be listed in the files of some [[topic]]
#   D (deleted)   must be listed in [[deletion]]
#   R (renamed)   must match a [[relocation]] from/to pair at 100% similarity
# A commit that adds such a path, or edits another upstream file, updates this
# ledger in the same commit.

[sync]
upstream = "https://github.com/invergent-ai/surogate.git"
last_synced = "282f99012a78c888725b8c3d8f9000749eca4e66"   # 2026-10-23

[owned]
# Fork-only paths: the merge base has no history for them.
prefixes = [
    "fork/",
    "csrc/src/testing/host/",
]
files = [
    "AGENTS.md",
    ".github/workflows/experimental-release.yml",
    "csrc/cmake/training_openmp.cmake",
    "csrc/src/runtime/ops/moe_weight_grad_policy.h",
    "tests/grpo/test_batch_distribution.py",
    "tests/grpo/test_inprocess_micro_batches.py",
    "tests/grpo/test_microbatch_preparation.py",
    "tests/grpo/test_packer_wait.py",
    "tests/grpo/test_trainer_cycle_timing.py",
]

# [root_rehome], [[relocation]] (from, to) and [[deletion]] (path, evidence)
# are added when upstream notes are moved out of the repository root.

# Topics: one per fork change to upstream files.
#   files       upstream paths the topic edits (status M)
#   fork_files  fork-owned paths that belong to the topic
#   tests       where the topic's tests live
#   conflict_history  measured or real merge conflicts, newest last

[[topic]]
id = "T1"
title = "dispatch-PP batched boundary reads"
commits = ["a28dfc33"]
switch = "always on"
files = [
    "csrc/src/binding/py_train.cpp",
    "csrc/src/runtime/executor/graph_executor.h",
    "csrc/src/runtime/executor/graph_executor.cpp",
    "csrc/src/runtime/executor/graph_executor_utils.h",
    "csrc/src/runtime/executor/graph_executor_utils.cpp",
    "csrc/src/testing/runtime/test-run-state-arena.cpp",
]
fork_files = []
tests = ["csrc/src/testing/runtime/test-run-state-arena.cpp"]
conflict_history = [
    "2026-10-27 reverse replay from b5af2f8e, conflict blocks at 90/30/14 days: py_train.cpp 1/0/0",
]

