[[topic]]
id = "T10"
title = "tied lm_head shares the embedding in full training"
commits = ["5722fc7f", "76b3f714", "7e16a238", "0d0310f0", "a5ed040f"]
# 76b3f714: Gemma 3 declaration, CPU-norm pin; 7e16a238: dispatch-PP refusal; 0d0310f0: loader-fallback pin;
# a5ed040f: published Gemma 3 configs check
switch = "always on for tie_word_embeddings models, Gemma 3 configs without the key included; LoRA/QLoRA unchanged, except that Gemma 3 LoRA now aliases the frozen head to the embedding as the other tied models do; dispatch-PP full training of a tied model refuses plans whose stage 0 and loss stage run on different GPUs"
# Defect (upstream 282f9901, unchanged since 2580d6cc / 4ac6a3d8): in full training the IR's lm_head is a
# trainable parameter of its own, while its gradient is the embedding's buffer (dsl_grad_store.cpp:104-113)
# and the GPU optimizers skip a gradient pointer they have seen (adamw_8bit_optimizer.cpp:237-241,
# adamw_optimizer.cpp:224/460, normuon_optimizer.cpp:317/542). Only the embedding was updated, with the
# summed gradient; the forward kept reading lm_head at its initial value, and checkpoints wrote it.
# dsl_param_store.cpp:203-204 aliased the storage only under freeze_base (LoRA) without the weight manager.
# Fix: dsl_param_store.cpp drops the freeze_base condition (and refuses a trainable tied head it cannot
# alias); the weight manager makes lm_head's master and work copy the embedding's in full training
# (dsl_weight_manager.cpp allocate_weights); weights shards and HF exports skip the alias (no
# lm_head.weight, as HF writes a tied model; dsl_param_store.cpp:473, dsl_weight_manager.cpp:1192,
# dsl_model_weights.cpp:345/567/576); under cpu_training the shared master takes one CPU step
# (adamw_8bit_optimizer.cpp:722-786; since T21 the master dedupe is build_layout in
# fork/native/src/cpu_adamw_checkpoint.cpp, which the CPU step and a resume share) and the tied gradient has one
# host copy, so the CPU norm counts it once (dsl_grad_store.cpp:797-806). Built for sm_120a without a GPU;
# behaviour is GPU-unverified.
# Gemma 3 text models (Gemma3ForCausalLM, Gemma3TextModel): the official config.json files have no
# tie_word_embeddings key (HF's Gemma3TextConfig defaults it to True; recorded from upstream's test fixtures,
# checked by test_the_published_gemma3_configs_still_omit_the_tie only against a cached checkpoint), and
# upstream's declaration carried none, so apply_declared_config_defaults (dsl_model.cpp:512-524) left
# TiedWordEmbeddings false and none of the above applied: lm_head, mapped to model.embed_tokens.weight,
# trained as a second matrix and the export wrote that tensor twice and threw. gemma3.py now declares tie_word_embeddings = True; an explicit
# key in config.json still wins. Gemma3ForConditionalGeneration has no DSL model (not trainable natively).
# GPU-unverified; the [tied-head] and TLC G2 gates do not take this path (hand-built graph; explicit key and
# lm_head.weight mapping), so the errata's verification paragraph gives a separate Gemma 3 full-training check.
# Relies on upstream code the fork does not edit (the pins check each), in two groups:
# (a) Unedited functions in T10's own files, so the sync report groups upstream commits to them under T10:
# the lm_head gradient being the embedding's buffer (dsl_grad_store.cpp DslGradStore ctor) and the pointer
# dedupe in adamw_8bit_optimizer.cpp init_state.
# (b) Files outside T10's `files`: the report never groups their upstream commits under T10, so a failing
# pin is T10's signal. Two of them belong to other topics, whose groups list their commits: cpu_adamw.cpp
# (T5) and py_train.cpp (T1). The code: the pointer dedupe in adamw_optimizer.cpp and normuon_optimizer.cpp
# step/step_graph, dsl_model.cpp calculate_gradient_norm and cpu_adamw.cpp cpu_gradient_norm_squared (the
# cpu_training norm over the shared host copy); the tie resolution in pretrained_config.cpp
# load_pretrained_config, ir.cpp load_ir_from_json and dsl_model.cpp apply_declared_config_defaults; the
# tied fallback in dsl_weight_loader.cpp DslWeightLoader::load_direct (a missing lm_head.weight reads the
# embedding), which reloads T10 exports where the head has its own storage (QLoRA, LoRA with the weight
# manager); and the dispatch-PP gradient collection the refusal below replays
# (dsl_model_execution.cpp dispatch_pp_read_block_grads/dispatch_pp_write_grads; py_train.cpp
# dispatch_pp_train_step_multigpu).
# Refused, not fixed (pre-existing upstream, CPU replay only): dispatch-PP full training reads the
# `embedding` gradient from stage 0's GPU and the `lm_head` gradient from the loss stage's GPU (py_train.cpp
# dispatch_pp_train_step_multigpu, stage s on GPU s % ngpu) and memcpys both into GPU 0's one aliased buffer
# (dsl_model_execution.cpp dispatch_pp_write_grads), the later write winning. When (num_stages-1) % ngpu != 0
# the tied matrix would get only the head gradient and lose the embedding-lookup gradient (e.g. 28 layers on
# 2 GPUs with SUROGATE_DISPATCH_STAGE_BLOCKS=14, or on 4/8 GPUs by default). Upstream never updated the head
# in any configuration; T10's setup refusal does not fire (every GPU holds a full replica). The SFT and GRPO
# trainers now call surogate/_fork/dispatch_pp_tied_head.py right after building the IR: with lora false and
# a tie resolved as the native trainer resolves it (config.json, else the declaration), such a plan raises
# ValueError naming stage sizes and GPU counts that keep both stages on GPU 0. A native fix (sum the copies
# across GPUs) would make the refusal unnecessary; test_dispatch_pp_tied_head.py pins the code it describes.
files = [
    "csrc/src/runtime/dsl/dsl_param_store.h",
    "csrc/src/runtime/dsl/dsl_param_store.cpp",
    "csrc/src/runtime/dsl/dsl_weight_manager.h",
    "csrc/src/runtime/dsl/dsl_weight_manager.cpp",
    "csrc/src/runtime/dsl/dsl_model_weights.cpp",
    "csrc/src/runtime/dsl/dsl_grad_store.cpp",
    "csrc/src/runtime/optimizers/adamw_8bit_optimizer.cpp",
    "surogate/dsl/models/gemma3.py",   # declares the tie the official Gemma 3 configs leave to HF's default
    "surogate/train/trainer.py",       # SFT: the dispatch-PP refusal call after the IR is built
    "surogate/grpo/trainer.py",        # GRPO: the same call (the file is shared with T6-T8)
]
fork_files = [
    "fork/native/cmake/fork_native.cmake",   # attaches the C++ test to dsl-run-state-tests (shared with T3, T5, T14–T17, T20, T21, T24)
    "fork/native/tests/test-fork-tied-lm-head.cpp",
    "fork/native/src/cpu_adamw_checkpoint.cpp",   # build_layout: the CPU step's tied dedupe since T21 (shared with T21)
    "fork/patches/tests/native/test_tied_lm_head.py",
    "surogate/_fork/dispatch_pp_tied_head.py",
    "fork/patches/tests/native/test_dispatch_pp_tied_head.py",
]
tests = [
    "fork/patches/tests/native/test_tied_lm_head.py",
    "fork/patches/tests/native/test_dispatch_pp_tied_head.py",
    "fork/native/tests/test-fork-tied-lm-head.cpp",
    "fork/tlc/tests/gpu/test_gates.py",
    "fork/tlc/tests/cpu/test_gpu_gate_logic.py",
]
conflict_history = [
    "2026-10-30 reverse replay of the dispatch-PP refusal call sites, conflict blocks at 90/30/14 days: surogate/train/trainer.py 0/0/0, surogate/grpo/trainer.py 0/0/0",
]

[[topic]]
id = "T11"
title = "GRPO training-path server builds non-streaming text once"
commits = ["afe88d26", "2586d3ac"]   # 2586d3ac: the window check no longer imports transformers.processing_utils
switch = "SUROGATE_GRPO_DETOK=final (default; removes only per-token text work whose result is discarded) | incremental (also a ByteLevel window for stop strings) | per_token (upstream's loop); streaming requests always use upstream's loop"
# shared_model.py keeps three hunks in SharedModelServer._generate: a local import of the fork
# module, `view = completion_view(...)` before the token loop, and after `stopped = token in eos`
# a `continue` on the steps that cannot end the completion. The step that ends it runs upstream's
# text block unchanged (one full decode, the stop truncation, one parse with final=True, the
# message), so the response is upstream's own computation. Upstream's non-final steps, without a
# callback, only rebuild values the next step overwrites, and their parse(final=False) only slices
# strings (tools are validated by request_tools), so for a given token stream the response equals
# upstream's. That is per request, not "the GPU gets upstream's calls": with the DecodeScheduler
# (every trainer with decode_batch_logits) the shorter host time per step changes when steps reach
# the scheduler, and so the number, size and membership of decode rounds, as any host speedup does;
# batched decode is not bitwise batch-invariant, so above concurrency 1 tokens match upstream only up
# to upstream's own timing nondeterminism. Default-on rests on that (no new nondeterminism), not on
# unchanged GPU calls; fork/docs/performance.md gives the concurrency-1 bitwise check for the 5090.
# The `incremental` mode's exactness argument (tokenizers 0.23.3 ByteLevel decode_chain and
# from_utf8_lossy) is in the `_ByteLevelTail` docstring of surogate/_fork/grpo_detok.py; it is
