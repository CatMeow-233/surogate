# attention_cudnn.cpp fed cuDNN 1/sqrt(HS) in both directions (:330, :394). cuDNN outranks mem_eff and flash_varlen
# (attention_backend.h), so every causal BF16 full-attention op with Hs <= 128 (multiple of 8) and no cu_seqlens ran
# at 1/sqrt(Hs), whatever the op declared. Reached by text-only Gemma3-27B checkpoints (Gemma3ForCausalLM; head_dim
# 128, query_pre_attn_scalar 168), Google's google/medgemma-27b-text-it among them (per its model card and a
