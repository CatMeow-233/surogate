[[topic]]
id = "T13"
title = "cpu_training: no step-start memset of the host gradients"
commits = ["796fdfa0", "e2f56d21"]
switch = "on by default (removes dead work; the host gradients are bit-identical); SUROGATE_FORK_HOST_GRAD_MEMSET=1 restores upstream's step-start memset and leaves the recorder inert, for A/B runs (read once per process)"
# DslGradStore::start_micro_step(0) memset every host gradient (mCpuGrads) on the rank thread before micro-step 0's
# backward: 16.4 GB for Qwen3-8B (about 0.55-0.8 s on one desktop core; 1.9 s at the 8.6 GB/s this VM's memset
# reaches). That micro-step's D2H copies, offload_layer_grads for block gradients and offload_non_block_grads for
# the rest, overwrite each buffer in full before anything reads it. Each copy into a host gradient calls
# HostGradOverwrites::before_copy (fork/native/include/surogate_fork/host_grad_overwrites.h) with its destination
# and size before it is enqueued, and zero_rest() zeroes only the buffers no copy of the step wrote (none in an
# FFT run; a non-block gradient without device storage, or a layer whose offload was skipped, otherwise), once
# per step, at start_micro_step(k > 0) or in wait_all_offloads, before the first reader. A copy that is the
# step's first into a buffer and covers only part of it (shorter, or starting inside it) zeroes the whole buffer
# in before_copy, before that copy is enqueued: upstream's order (memset, then copy). No call site makes such a
# copy today (each copies the bytes() of the tensor the host buffer was allocated from); the rule keeps a future
# one correct. Registered buffers may not overlap (add() throws). No zeroing races a copy: zero_rest() touches
# only buffers no copy of the step wrote, before_copy() zeroes before the copy it precedes and only a buffer no
# earlier copy of the step wrote, the previous step's copies finished in its wait_all_offloads, and the readers
# are enqueued or run only later. cpu-step-contract replays the protocol (coverage gaps, copies shorter than the
# buffer or at an offset, a tied buffer, a buffer without a device copy, GA 1-4) against the memset path and gets
# the same bytes. Relies on step_cpu_streaming being the only reader of host gradients, after wait_all_offloads,
# and on the three host-gradient copies of the grad store, each preceded by before_copy (test_cpu_step_hooks.py
# pins both). The first version (796fdfa0) recorded a copy after enqueuing it and let a partial copy cover
# nothing, so zero_rest() would have zeroed such a buffer under or after its copy; it made no partial copy.
# SUROGATE_FORK_HOST_GRAD_MEMSET=1 (host_grad_memset_enabled() in host_grad_overwrites.h; exactly "1", read once per
# process) gives the A/B and escape hatch the other perf topics have: allocate_streaming_buffers builds the recorder
# with upstream_memset, so add() only lists each mCpuGrads entry (Data, bytes(), in the map's order, no merge and no
# overlap check), begin_step() (in start_micro_step(0), where upstream's loop stood) memsets every entry as that loop
# did, and before_copy()/zero_rest() never zero (mPending is never set). The upstream hunks stay as they are but for
# the constructor argument; cpu-step-contract replays the protocol with the switch against the memset path and checks
# the recorder zeroes nothing, the value rule and the once-per-process read; the pin checks the construction, the
# registration order and the header's early returns.
# Not a defect fix (no errata entry): the memset was redundant, not wrong. GPU behaviour is unchanged by
# construction; dsl_grad_store.cpp is compile-checked for sm_120a only, and the 5090 check (an A/B on one build,
# with and without the switch) is in fork/docs/performance.md ("cpu_training 主机端步").
files = [
    "csrc/src/runtime/dsl/dsl_grad_store.h",
    "csrc/src/runtime/dsl/dsl_grad_store.cpp",
]
fork_files = [
    "fork/native/include/surogate_fork/host_grad_overwrites.h",
    "fork/native/openmp-contract/CMakeLists.txt",   # shared with T5, T14, T15
    "fork/native/openmp-contract/cpu_step_check.cpp",
    "fork/patches/tests/native/test_cpu_step_hooks.py",
]
tests = [
    "fork/native/openmp-contract/cpu_step_check.cpp",
    "fork/patches/tests/native/test_cpu_step_hooks.py",
]
