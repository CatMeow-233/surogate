# Track S generator spec (MS §6.2; docs/spec.md, I4). Read by `python -m surogate_bilingual synth`.
#
# Everything here is a [建议] default of the preregistration draft v1.1 until the owner locks it (MS §9.7). The
# generator version lives in the code (surogate_bilingual.data.synth.build.TRACK_S_VERSION); the same
# (version, spec, profile, seed) gives byte-identical output, and the data card records the sha256 of this file.
#
# Template lists are append-only: ids are derived from list positions (templates.py), so inserting a string in
# the middle of a list renames every later template. Train, dev and test pools are disjoint by construction.

[track_s]
spec_version = 1
# E3-par month_sum_mod12 numbers the months January = 1 ... December = 12.

# ---------------------------------------------------------------------------------------------------------------
# Sizes. `full` is the confirmatory build; `ci` is the CPU-test build (same templates, tiny counts).
# ---------------------------------------------------------------------------------------------------------------

[profile.full]
partitions = { seed = 4000, zh = 4000, en = 4000, par = 2000 }
heldout_fraction = 0.5        # of P_zh and P_en: no QA in any training data; E1/E2/E3-par ask about them
eval_dev_fraction = 0.2       # of every held-out group: dev people; the rest are test people
par_train_fraction = 0.5      # of P_par: parallel biographies in D_parallel; the rest are E4 people
values = { city = 200, occupation = 100, employer = 200, hobby = 60 }
min_rewrites = 5              # distinct biography renderings per person and language, at least
# Exposures per fact = biography renderings that state it (every rendering states all six facts).
bio_exposures = { seed = { zh = 50, en = 50 }, zh = { zh = 100 }, en = { en = 100 } }
parallel_pairs_per_person = 10
qa_per_fact = { seed = 1, zh = 2, en = 2 }   # QA documents per fact (and per language for P_seed)
seed_par_samples = 20000      # E3-par format samples over P_seed pairs (both variants, both languages)
seed_ctx_samples = 80000      # E3-ctx format samples in D_seed, the eight language orders equally
expert_ctx_samples = 40000    # monolingual E3-ctx samples in D_zh and in D_en each
items = { test = 2000, dev = 500 }            # per family, variant and direction
ctx_categories = 7            # K: the rules are a bijection between 7 colours and the 7 weekdays
ctx_distractors = [0, 3]      # distractor entities in the fact segment, uniform in the range
e4_attributes = [3, 6]        # facts in an E4 source passage, uniform in the range

[profile.ci]
partitions = { seed = 40, zh = 60, en = 60, par = 40 }
heldout_fraction = 0.5
eval_dev_fraction = 0.25
par_train_fraction = 0.5
values = { city = 12, occupation = 12, employer = 12, hobby = 12 }
min_rewrites = 5
bio_exposures = { seed = { zh = 5, en = 5 }, zh = { zh = 6 }, en = { en = 6 } }
parallel_pairs_per_person = 2
qa_per_fact = { seed = 1, zh = 1, en = 1 }
seed_par_samples = 40
seed_ctx_samples = 64
expert_ctx_samples = 24
items = { test = 24, dev = 8 }
ctx_categories = 7
ctx_distractors = [0, 3]
e4_attributes = [3, 6]

# ---------------------------------------------------------------------------------------------------------------
# Chinese templates. A Latin-script placeholder ({name}, {a}, {b}, {entity}) is separated from Han characters by a
# space or punctuation, so names tokenize the same way in both languages.
# ---------------------------------------------------------------------------------------------------------------

[templates.zh.bio.year]
train = [
