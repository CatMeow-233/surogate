seed_pack = "data/runs/seed-I-r{r}/packs/seed"

[stage.b2-I]  # k = 9: one bilingual expert on the ZH + EN tokens (RQ3b)
replicates = [0, 1, 2]

[stage.b2-I.train]
lr = 2e-4

[stage.b2-I.run]
recipe = "expert"
expert = "bi"
matrix_row = "B2"
init_seed = [9001, 9011, 9021]
data_seed = [9002, 9012, 9022]
tokens = 400_000_000
shard = "data/shards/zh_en"
seed_pack = "data/runs/seed-I-r{r}/packs/seed"

[stage.b12a-I]  # k = 10: the width-2f ceiling; over the update budget by design
replicates = [0, 1, 2]

[stage.b12a-I.train]
lr = 2e-4

[stage.b12a-I.run]
recipe = "joint_wide"
expert = "joint"
matrix_row = "B12a"
init_seed = [10_001, 10_011, 10_021]
data_seed = [10_002, 10_012, 10_022]
tokens = 400_000_000
shard = "data/shards/zh_en"
seed_pack = "data/runs/seed-I-r{r}/packs/seed"

[stage.lp4-zh-I]  # k = 11: LP-4 = layers 0..3 and 20..23 (MS §8.2)
replicates = [0, 1, 2]

[stage.lp4-zh-I.model]
expert_layers = [0, 1, 2, 3, 20, 21, 22, 23]

[stage.lp4-zh-I.train]
lr = 2e-4

[stage.lp4-zh-I.run]
recipe = "expert"
expert = "zh"
matrix_row = "LP-4"
init_seed = [11_001, 11_011, 11_021]
data_seed = [11_002, 11_012, 11_022]
tokens = 200_000_000
shard = "data/shards/zh"
seed_pack = "data/runs/seed-I-r{r}/packs/seed"

[stage.lp4-en-I]  # k = 12
