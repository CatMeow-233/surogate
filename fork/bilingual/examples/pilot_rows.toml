# Run configs of the minimal decisive set (MS §13) and the G1' pilot, one stage per training row.
#
#   python -m surogate_bilingual train fork/bilingual/examples/pilot_rows.toml --list
#   python -m surogate_bilingual train fork/bilingual/examples/pilot_rows.toml --stage seed-I-r0 [--dry-run]
#
# Status: every value is a [建议] default of the preregistration draft v1.1 (B-O7, B-O10) until the owner locks it
# (MS §9.7); G1' and G0.5 may change the token budgets and the replicate count. Nothing here has run.
#
# - `replicates = [0, 1, 2]` expands a stage into NAME-r0, NAME-r1, NAME-r2; "{r}" in strings is the replicate, and
#   init_seed / data_seed lists give one seed per replicate. A replicate is a new seed S plus new experts (B-O6).
# - Seeds follow one scheme, so that no two runs share one: init_seed = 1000 k + 10 r + 1 and
#   data_seed = 1000 k + 10 r + 2, with k the stage's number below. Expert runs start from their seed pack, so their
#   init_seed is recorded but draws nothing.
# - lr is the middle of the MS §8 grid (seed {3e-4, 6e-4, 1e-3}, experts {1e-4, 2e-4, 3e-4}); the tuning ledger
#   (MS §9.6) runs each arm's three dev trials as separate runs: --set train.lr=3e-4 --name seed-I-r0-lr3e-4.
# - Paths are relative to the repository root (the runbook's working directory); everything under data/ is
#   git-ignored. The data pipeline (`shard`, step I4) writes the shards: seed, zh, en as in the runbook's G1' data
#   preparation; zh_en with `--split zh_train,en_train` (B2, B12a, and the T3'' replay); parallel with `--bridge`,
#   parallel_zh_en / parallel_en_zh with `--bridge --direction`, parallel_unpaired with `--bridge --unpair-seed`.
#   Packs land in data/runs/<run name>/packs/.
# - Tokens per replicate: G1' 0.9B (mech8); family I 2.4B, family II 1.2B, Bridge 0.4B, together 4.0B (MS §13).

[model]
profile = "pilot"
family = "swiglu"

[train]                       # B-O10: 65,536 tokens/step = 16 x 1024 x accum 4; warmup 2 %, cosine to 10 %
global_batch_tokens = 65536
microbatch = 16
seq = 1024
accum = 4

# ---------------------------------------------------------------------------------------------------------------
# G1': the measurability pilot (mech8 = 8 layers), 3 replicates. Pass rule: runbook G1'.
# ---------------------------------------------------------------------------------------------------------------

[stage.g1p-seed]  # k = 1
replicates = [0, 1, 2]

[stage.g1p-seed.model]
profile = "mech8"

[stage.g1p-seed.train]
lr = 6e-4

[stage.g1p-seed.run]
recipe = "seed"
matrix_row = "B0"
init_seed = [1001, 1011, 1021]
data_seed = [1002, 1012, 1022]
tokens = 300_000_000
shard = "data/shards/seed"
tokenizer = "data/tokenizer/tokenizer.json"

[stage.g1p-zh]  # k = 2
replicates = [0, 1, 2]

[stage.g1p-zh.model]
profile = "mech8"

[stage.g1p-zh.train]
lr = 2e-4

[stage.g1p-zh.run]
recipe = "expert"
expert = "zh"
matrix_row = "B1"
init_seed = [2001, 2011, 2021]
data_seed = [2002, 2012, 2022]
tokens = 100_000_000
shard = "data/shards/zh"
seed_pack = "data/runs/g1p-seed-r{r}/packs/seed"

[stage.g1p-en]  # k = 3
replicates = [0, 1, 2]

[stage.g1p-en.model]
profile = "mech8"

[stage.g1p-en.train]
lr = 2e-4

[stage.g1p-en.run]
recipe = "expert"
expert = "en"
matrix_row = "B1"
init_seed = [3001, 3011, 3021]
data_seed = [3002, 3012, 3022]
tokens = 100_000_000
shard = "data/shards/en"
seed_pack = "data/runs/g1p-seed-r{r}/packs/seed"

[stage.g1p-b2]  # k = 4
replicates = [0, 1, 2]

[stage.g1p-b2.model]
profile = "mech8"

[stage.g1p-b2.train]
lr = 2e-4

[stage.g1p-b2.run]
recipe = "expert"
expert = "bi"
matrix_row = "B2"
init_seed = [4001, 4011, 4021]
data_seed = [4002, 4012, 4022]
tokens = 200_000_000
shard = "data/shards/zh_en"
seed_pack = "data/runs/g1p-seed-r{r}/packs/seed"

[stage.g1p-b12a]  # k = 5
replicates = [0, 1, 2]

[stage.g1p-b12a.model]
profile = "mech8"

[stage.g1p-b12a.train]
lr = 2e-4

[stage.g1p-b12a.run]
recipe = "joint_wide"
expert = "joint"
matrix_row = "B12a"
init_seed = [5001, 5011, 5021]
data_seed = [5002, 5012, 5022]
tokens = 200_000_000
shard = "data/shards/zh_en"
seed_pack = "data/runs/g1p-seed-r{r}/packs/seed"

# ---------------------------------------------------------------------------------------------------------------
