[stage.zh-II.run]
recipe = "expert"
expert = "zh"
matrix_row = "B1'"
init_seed = [14_001, 14_011, 14_021]
data_seed = [14_002, 14_012, 14_022]
tokens = 200_000_000
shard = "data/shards/zh"
seed_pack = "data/runs/seed-II-r{r}/packs/seed"

[stage.en-II]  # k = 15
replicates = [0, 1, 2]

[stage.en-II.model]
