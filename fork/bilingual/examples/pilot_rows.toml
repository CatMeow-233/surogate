seed_pack = "data/runs/seed-I-r{r}/packs/seed"

# ---------------------------------------------------------------------------------------------------------------
# Family II (the canonical slot operator, B-O4; MS §7.2): S_II, ZH-II, EN-II. B4-II, B8 and B9-II only assemble.
# ---------------------------------------------------------------------------------------------------------------

