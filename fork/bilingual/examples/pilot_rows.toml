[stage.seed-II.run]
recipe = "seed"
matrix_row = "B0'"
init_seed = [13_001, 13_011, 13_021]
data_seed = [13_002, 13_012, 13_022]
tokens = 800_000_000
shard = "data/shards/seed"
tokenizer = "data/tokenizer/tokenizer.json"

[stage.zh-II]  # k = 14
replicates = [0, 1, 2]

[stage.zh-II.model]
family = "slot"

[stage.zh-II.train]
