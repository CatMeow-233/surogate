# ---------------------------------------------------------------------------------------------------------------
# Bridge (family I, ZH-I and EN-I frozen; MS §7.3, §8.4): T1' (both directions), T2, T3', T3''. Every T arm has
# the same parallel-token budget, steps and lr grid. The parallel shards put the source span on its language's
# route with loss 0 and the target span on the "bridge" route; T1' needs one shard per direction.
# ---------------------------------------------------------------------------------------------------------------

[stage.t1p-en-I]  # k = 16: zh>en: trains a copy of EN-I
replicates = [0, 1, 2]

[stage.t1p-en-I.train]
lr = 2e-4

[stage.t1p-en-I.run]
recipe = "target_copy"
target = "en"
source = "zh"
matrix_row = "T1'"
init_seed = [16_001, 16_011, 16_021]
data_seed = [16_002, 16_012, 16_022]
tokens = 50_000_000
shard = "data/shards/parallel_zh_en"
seed_pack = "data/runs/seed-I-r{r}/packs/seed"
packs = { zh = "data/runs/zh-I-r{r}/packs/zh", en = "data/runs/en-I-r{r}/packs/en" }

[stage.t1p-zh-I]  # k = 17: en>zh: trains a copy of ZH-I
replicates = [0, 1, 2]

[stage.t1p-zh-I.train]
lr = 2e-4

[stage.t1p-zh-I.run]
recipe = "target_copy"
target = "zh"
source = "en"
matrix_row = "T1'"
init_seed = [17_001, 17_011, 17_021]
data_seed = [17_002, 17_012, 17_022]
tokens = 50_000_000
shard = "data/shards/parallel_en_zh"
seed_pack = "data/runs/seed-I-r{r}/packs/seed"
packs = { zh = "data/runs/zh-I-r{r}/packs/zh", en = "data/runs/en-I-r{r}/packs/en" }

[stage.t2-I]  # k = 18: the Bridge, variant (c) (B-O13)
replicates = [0, 1, 2]

[stage.t2-I.train]
lr = 2e-4
bridge_variant = "c"

[stage.t2-I.run]
recipe = "bridge"
expert = "bridge"
matrix_row = "T2"
init_seed = [18_001, 18_011, 18_021]
data_seed = [18_002, 18_012, 18_022]
tokens = 100_000_000
shard = "data/shards/parallel"
seed_pack = "data/runs/seed-I-r{r}/packs/seed"
packs = { zh = "data/runs/zh-I-r{r}/packs/zh", en = "data/runs/en-I-r{r}/packs/en" }

[stage.t3p-I]  # k = 19: a third expert on parallel data whose pairs are shuffled
replicates = [0, 1, 2]

[stage.t3p-I.train]
lr = 2e-4
bridge_variant = "c"

[stage.t3p-I.run]
recipe = "bridge"
expert = "t3"
matrix_row = "T3'"
init_seed = [19_001, 19_011, 19_021]
data_seed = [19_002, 19_012, 19_022]
tokens = 100_000_000
shard = "data/shards/parallel_unpaired"
seed_pack = "data/runs/seed-I-r{r}/packs/seed"
packs = { zh = "data/runs/zh-I-r{r}/packs/zh", en = "data/runs/en-I-r{r}/packs/en" }

[stage.t3pp-I]  # k = 20: a third expert on as many monolingual replay tokens
replicates = [0, 1, 2]

[stage.t3pp-I.train]
lr = 2e-4

[stage.t3pp-I.run]
recipe = "expert"
expert = "t3"
matrix_row = "T3''"
init_seed = [20_001, 20_011, 20_021]
data_seed = [20_002, 20_012, 20_022]
tokens = 100_000_000
shard = "data/shards/zh_en"
seed_pack = "data/runs/seed-I-r{r}/packs/seed"
