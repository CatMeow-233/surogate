# ---------------------------------------------------------------------------------------------------------------

[stage.seed-I]  # k = 6
replicates = [0, 1, 2]

[stage.seed-I.train]
lr = 6e-4

[stage.seed-I.run]
recipe = "seed"
matrix_row = "B0"
init_seed = [6001, 6011, 6021]
data_seed = [6002, 6012, 6022]
tokens = 800_000_000
shard = "data/shards/seed"
tokenizer = "data/tokenizer/tokenizer.json"

[stage.zh-I]  # k = 7
replicates = [0, 1, 2]

[stage.zh-I.train]
lr = 2e-4

[stage.zh-I.run]
recipe = "expert"
expert = "zh"
matrix_row = "B1"
init_seed = [7001, 7011, 7021]
data_seed = [7002, 7012, 7022]
tokens = 200_000_000
shard = "data/shards/zh"
seed_pack = "data/runs/seed-I-r{r}/packs/seed"

[stage.en-I]  # k = 8
replicates = [0, 1, 2]

[stage.en-I.train]
lr = 2e-4

[stage.en-I.run]
recipe = "expert"
expert = "en"
matrix_row = "B1"
init_seed = [8001, 8011, 8021]
data_seed = [8002, 8012, 8022]
